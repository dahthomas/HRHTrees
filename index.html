<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRH Trees &mdash; Heidi Harrington</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:  #1a2e1a;
      --moss:    #2d4a2d;
      --sage:    #7a9e6e;
      --cream:   #f4f0e8;
      --warm:    #e8e0d0;
      --text:    #1a1a18;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    /* ── MAIN ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 60px);
    }

    /* ── PHOTO HALF ── */
    .photo-side {
      position: relative;
      overflow: hidden;
    }

    .photo-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: saturate(0.85);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(26, 46, 26, 0.18) 0%,
        rgba(26, 46, 26, 0.05) 100%
      );
    }

    /* ── CONTENT HALF ── */
    .content-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 6% 5rem 7%;
      background: var(--cream);
      position: relative;
    }

    /* thin vertical rule between halves */
    .content-side::before {
      content: '';
      position: absolute;
      left: 0; top: 10%; bottom: 10%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--sage), transparent);
    }

    /* ── BUSINESS NAME ── */
    .business-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3rem, 5vw, 5rem);
      letter-spacing: 0.06em;
      color: var(--forest);
      line-height: 1;
      margin-bottom: 0.3rem;
      animation: fadeUp 0.9s ease both;
    }

    .business-name span {
      font-style: italic;
      color: var(--sage);
    }

    /* ── PERSON NAME ── */
    .person-name {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #6b7c6b;
      margin-bottom: 3rem;
      animation: fadeUp 0.9s 0.1s ease both;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 48px;
      height: 1px;
      background: var(--sage);
      margin-bottom: 2.4rem;
      animation: fadeUp 0.9s 0.2s ease both;
    }

    /* ── CREDENTIALS ── */
    .credentials {
      margin-bottom: 3.5rem;
      animation: fadeUp 0.9s 0.3s ease both;
    }

    .credential {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    .credential-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
      margin-top: 0.5em;
    }

    .credential-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 1.8vw, 1.35rem);
      font-weight: 400;
      color: var(--forest);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    /* ── CONTACT ── */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      animation: fadeUp 0.9s 0.4s ease both;
    }

    .contact a {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: clamp(0.82rem, 1.1vw, 0.92rem);
      letter-spacing: 0.12em;
      color: #5a6e5a;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: color 0.2s;
    }

    .contact a:hover { color: var(--forest); }

    .contact-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sage);
      min-width: 44px;
    }

    /* ── FOOTER ── */
    footer {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--forest);
      color: rgba(255,255,255,0.35);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 55vw 1fr;
      }
      .photo-side { height: 100%; }
      .content-side {
        padding: 3rem 8%;
      }
      .content-side::before { display: none; }
      .business-name { font-size: clamp(2.8rem, 14vw, 4rem); }
    }
  </style>
</head>
<body>

<main>
  <div class="photo-side">
    <img src="images/photo.webp" alt="Tree-lined street" />
    <div class="photo-overlay"></div>
  </div>

  <div class="content-side">

    <h1 class="business-name">HRH<br><span>Trees</span></h1>
    <p class="person-name">Heidi Harrington</p>

    <div class="divider"></div>

    <div class="credentials">
      <div class="credential">
        <div class="credential-dot"></div>
        <p class="credential-text">Certified Arborist</p>
      </div>
      <div class="credential">
        <div class="credential-dot"></div>
        <p class="credential-text">Certified Forester</p>
      </div>
    </div>

    <div class="contact">
      <a href="tel:4044445824">
        <span class="contact-label">Phone</span>
        404-444-5824
      </a>
      <a href="mailto:heidi@hrhtrees.com">
        <span class="contact-label">Email</span>
        heidi@hrhtrees.com
      </a>
    </div>

  </div>
</main>

<footer>
  &copy; <span id="yr"></span> HRH Trees &nbsp;&middot;&nbsp; Heidi Harrington
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>

</body>
</html>
